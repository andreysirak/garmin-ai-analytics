apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "garmin-chat.name" . }}-ollama
  labels:
    {{- include "garmin-chat.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Avoid two writers to the model PVC and two CPU model instances during upgrades.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ollama
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: ollama
          image: {{ .Values.ollama.image | quote }}
          imagePullPolicy: {{ .Values.ollama.imagePullPolicy }}
          command: [/bin/ollama, serve]
          ports:
            - {name: http, containerPort: 11434}
          env:
            - {name: HOME, value: /tmp}
            - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
            - {name: OLLAMA_MODELS, value: /models}
            - {name: OLLAMA_NUM_PARALLEL, value: "1"}
            - {name: OLLAMA_MAX_LOADED_MODELS, value: "1"}
            - {name: OLLAMA_MAX_QUEUE, value: "1"}
            - {name: CUDA_VISIBLE_DEVICES, value: "-1"}
            - {name: ROCR_VISIBLE_DEVICES, value: "-1"}
            - {name: OLLAMA_VULKAN, value: "false"}
            - {name: OLLAMA_NO_CLOUD, value: "true"}
            - name: OLLAMA_CONTEXT_LENGTH
              value: {{ .Values.ollama.contextLength | quote }}
          volumeMounts:
            - {name: models, mountPath: /models}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            # Server readiness lets the model-pull Job reach this Service before a model exists.
            exec:
              command: [/bin/sh, -ec, 'OLLAMA_HOST=http://127.0.0.1:11434 ollama list']
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: http}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.ollama.resources | nindent 12 }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "garmin-chat.name" . }}-models
