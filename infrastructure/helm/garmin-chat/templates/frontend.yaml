apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "garmin-chat.name" . }}-frontend
  labels:
    {{- include "garmin-chat.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: frontend
      annotations:
        chat.garmin/build-id: {{ .Values.buildId | quote }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: {{ .Values.frontend.image | quote }}
          imagePullPolicy: {{ .Values.frontend.imagePullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: BACKEND_HOST
              value: {{ printf "%s-backend" (include "garmin-chat.name" .) | quote }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
