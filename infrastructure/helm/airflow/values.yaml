airflowVersion: "3.3.1"
defaultAirflowTag: "3.3.1"
images:
  airflow:
    repository: garmin-airflow
    tag: "local"

executor: LocalExecutor
allowPodLaunching: false
useStandardNaming: true

fernetKeySecretName: airflow-fernet-key
apiSecretKeySecretName: airflow-api-secret-key
jwtSecretName: airflow-jwt-secret
extraEnv: |
  - name: GARMIN_RAW_DATA_GID
    value: {{ required "garminRawDataGid must be supplied by Makefile" .Values.garminRawDataGid | quote }}

data:
  metadataSecretName: airflow-metadata-db

postgresql:
  enabled: true
  auth:
    enablePostgresUser: true
    existingSecret: airflow-postgresql
    username: airflow
    database: airflow
  primary:
    persistence:
      enabled: true
      size: 2Gi
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}

config:
  core:
    load_examples: "False"
    dags_are_paused_at_creation: "True"
    auth_manager: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    simple_auth_manager_users: "admin:admin"
    simple_auth_manager_passwords_file: /opt/airflow/simple-auth/passwords.json
  api:
    expose_config: "False"

dags:
  persistence:
    enabled: true
    existingClaim: airflow-dags
logs:
  persistence:
    enabled: true
    existingClaim: airflow-logs

migrateDatabaseJob:
  useHelmHooks: false
createUserJob:
  enabled: false
apiServer:
  extraVolumes:
    - name: simple-auth-secret
      secret:
        secretName: airflow-simple-auth
    - name: simple-auth
      emptyDir: {}
  extraVolumeMounts:
    - name: simple-auth
      mountPath: /opt/airflow/simple-auth
  extraInitContainers:
    - name: copy-simple-auth
      image: busybox:1.37
      command: ["sh", "-c", "cp /secret/passwords.json /target/passwords.json"]
      volumeMounts:
        - {name: simple-auth-secret, mountPath: /secret, readOnly: true}
        - {name: simple-auth, mountPath: /target}
  service:
    type: NodePort
    ports:
      - name: api-server
        port: 8080
        nodePort: 30080
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
scheduler:
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 1Gi}
dagProcessor:
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 768Mi}
triggerer:
  enabled: false
statsd:
  enabled: false
