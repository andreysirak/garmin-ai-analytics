airflowVersion: "3.3.1"
defaultAirflowTag: "3.3.1"
images:
  airflow:
    repository: garmin-airflow
    tag: "local"

executor: LocalExecutor
allowPodLaunching: false
useStandardNaming: true

# Bootstrap supplies an empty key for fresh local setups; preserve existing encryption keys.
fernetKeySecretName: airflow-fernet-key
apiSecretKeySecretName: airflow-api-secret-key
jwtSecretName: airflow-jwt-secret
extraEnv: |
  - name: GARMIN_RAW_DATA_GID
    value: {{ required "garminRawDataGid must be supplied by Makefile" .Values.garminRawDataGid | quote }}

data:
  metadataSecretName: airflow-metadata-db

postgresql:
  enabled: true
  # Chart 13.2.24 retains PostgreSQL 16; do not change majors during reattachment.
  storageIdentity: ""
  auth:
    enablePostgresUser: true
    existingSecret: airflow-postgresql
    username: airflow
    database: airflow
  primary:
    persistence:
      enabled: true
      size: 2Gi
      existingClaim: airflow-postgresql-data
    podSecurityContext:
      runAsUser: 1001  # Make overrides this and the container UID with the Mac owner.
      supplementalGroups: []  # Make supplies the host directory's group.
    initContainers:
      - name: verify-database-storage
        image: busybox:1.37
        securityContext:
          runAsNonRoot: true
          # Inherit the pod UID supplied by Make, matching the PostgreSQL container.
          runAsGroup: 1001
          allowPrivilegeEscalation: false
        env:
          - name: EXPECTED_STORAGE_ID
            value: '{{ required "postgresql.storageIdentity must be supplied by Make" .Values.storageIdentity }}'
        command:
          - sh
          - -ec
          - |
            test "$(cat /storage/.volume-id)" = "$EXPECTED_STORAGE_ID"
            if [ -d /storage/data ]; then
              test "$(stat -c %u /storage/data)" = "$(id -u)" || {
                echo "PostgreSQL data directory owner must match its process UID" >&2
                exit 1
              }
              entries=$(ls -A /storage/data)
              if [ -n "$entries" ]; then
                test "$(cat /storage/data/PG_VERSION)" = 16
              fi
              probe=$(mktemp /storage/data/.write-check.XXXXXX)
              rm "$probe"
            fi
            probe=$(mktemp /storage/.write-check.XXXXXX)
            rm "$probe"
        volumeMounts:
          - name: data
            mountPath: /storage
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}

config:
  core:
    # LocalExecutor workers share the scheduler Pod's memory budget.
    parallelism: "4"
    load_examples: "False"
    dags_are_paused_at_creation: "True"
    auth_manager: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    simple_auth_manager_users: "admin:admin"
    simple_auth_manager_passwords_file: /opt/airflow/simple-auth/passwords.json
  api:
    expose_config: "False"

dags:
  persistence:
    enabled: true
    existingClaim: airflow-dags
logs:
  persistence:
    enabled: true
    existingClaim: airflow-logs

migrateDatabaseJob:
  useHelmHooks: false
createUserJob:
  enabled: false
apiServer:
  extraVolumes:
    - name: simple-auth-secret
      secret:
        secretName: airflow-simple-auth
    - name: simple-auth
      emptyDir: {}
  extraVolumeMounts:
    - name: simple-auth
      mountPath: /opt/airflow/simple-auth
  extraInitContainers:
    - name: copy-simple-auth
      image: busybox:1.37
      command: ["sh", "-c", "cp /secret/passwords.json /target/passwords.json"]
      volumeMounts:
        - {name: simple-auth-secret, mountPath: /secret, readOnly: true}
        - {name: simple-auth, mountPath: /target}
  service:
    type: NodePort
    ports:
      - name: api-server
        port: 8080
        nodePort: 30080
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
scheduler:
  # LocalExecutor runs the Python loader here. The archive PVC belongs to
  # airflow-jobs, so read the same existing kind host mount without a second PVC.
  extraVolumes:
    - name: garmin-raw-data
      hostPath:
        path: /mnt/garmin-raw-data
        type: Directory
  extraVolumeMounts:
    - name: garmin-raw-data
      mountPath: /data/raw/garmin
      readOnly: true
  securityContexts:
    pod:
      runAsUser: 50000
      fsGroup: 0
      # Makefile adds the host archive GID as a supplemental group.
  resources:
    requests: {cpu: 200m, memory: 512Mi}
    limits: {memory: 2Gi}
dagProcessor:
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 768Mi}
triggerer:
  enabled: false
statsd:
  enabled: false
