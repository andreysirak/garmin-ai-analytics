# Lets the Airflow scheduler (LocalExecutor runs tasks inside it) manage task Pods
# in the airflow-jobs namespace only. The ServiceAccount itself is created by the Helm chart.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-pod-launcher
  namespace: airflow-jobs
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-pod-launcher
  namespace: airflow-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-pod-launcher
subjects:
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: airflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-garmin-auth-pod-launcher
  namespace: garmin-auth
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-garmin-auth-pod-launcher
  namespace: garmin-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-garmin-auth-pod-launcher
subjects:
  - kind: ServiceAccount
    name: airflow-scheduler
    namespace: airflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garmin-token-manager
  namespace: airflow-jobs
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["garmin-access-token"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garmin-token-manager
  namespace: airflow-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garmin-token-manager
subjects:
  - kind: ServiceAccount
    name: garmin-auth
    namespace: garmin-auth
