kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: garmin-ai-analytics
nodes:
  - role: control-plane
    image: kindest/node:v1.33.7
    extraMounts:
      # Relative to the directory kind is run from (repository root, see Makefile).
      - hostPath: ./airflow/dags
        containerPath: /mnt/airflow-dags
        readOnly: true
      - hostPath: ./data/raw/garmin
        containerPath: /mnt/garmin-raw-data
    extraPortMappings:
      # Airflow API server / UI (NodePort 30080) -> http://localhost:8080
      - containerPort: 30080
        hostPort: 8080
        listenAddress: 127.0.0.1
        protocol: TCP
      # PostgreSQL NodePort -> password-authenticated access from the Mac.
      - containerPort: 30432
        hostPort: 5432
        listenAddress: 127.0.0.1
        protocol: TCP
