name: Garmin API Integration CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-verify:
    name: Garmin API Integration Java
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Validate Airflow DAG syntax
        run: python3 -m py_compile airflow/dags/garmin_daily_ingestion.py
      - name: Verify Java integration
        run: mvn -B -ntp -f garmin-integration/pom.xml clean verify
      - name: Upload Java reports after failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-integration-reports
          if-no-files-found: ignore
          path: |
            garmin-integration/**/target/surefire-reports/**
            garmin-integration/**/target/site/spotbugs.html
            garmin-integration/**/target/spotbugsXml.xml
            garmin-integration/**/target/pmd.xml

  python-verify:
    name: Garmin API Integration Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            garmin-integration/garmin-auth/python/pyproject.toml
            garmin-integration/garmin-daily-summary/python/pyproject.toml
            garmin-integration/garmin-sleep/python/pyproject.toml
      - name: Install Python packages and verification tools
        run: |
          constraints="https://raw.githubusercontent.com/apache/airflow/constraints-3.3.1/constraints-3.12.txt"
          python -m pip install --constraint "$constraints" \
            -e "garmin-integration/garmin-auth/python[airflow,dev]" \
            -e "garmin-integration/garmin-daily-summary/python[dev]" \
            -e "garmin-integration/garmin-sleep/python[dev]"
      - name: Lint Python integration
        run: |
          ruff check airflow/dags airflow/tests \
            garmin-integration/garmin-auth/python \
            garmin-integration/garmin-daily-summary/python \
            garmin-integration/garmin-sleep/python
      - name: Test Python integration
        run: |
          pytest -q \
            airflow/tests \
            garmin-integration/garmin-auth/python/tests \
            garmin-integration/garmin-daily-summary/python/tests \
            garmin-integration/garmin-sleep/python/tests
