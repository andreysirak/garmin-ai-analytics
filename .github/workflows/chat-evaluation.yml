name: Garmin Chat Evaluation Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-contracts:
    name: Garmin Chat Evaluation Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Check cases, graders and production bridge
        run: make chat-eval-test
      - name: Prepare production prompt adapter
        run: make chat-eval-prepare
      - name: Exercise capture with real Java and a synthetic HTTP stub
        run: GARMIN_EVAL_JAVA_SMOKE=1 python3 -m unittest discover -s garmin-chat/evaluation/tests -p test_bridge_transport.py -v
