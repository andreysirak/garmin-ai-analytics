[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-airflow-operators"
version = "0.1.0"
description = "Airflow operators for loading immutable JSON archives into PostgreSQL"
requires-python = ">=3.11"
dependencies = [
  "apache-airflow>=3.3,<4",
  "apache-airflow-providers-postgres>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
garmin_airflow_operators = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
